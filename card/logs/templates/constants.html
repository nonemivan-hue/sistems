{% extends "base.html" %}
{% block title %}Константы{% endblock %}
{% block page_title %}Константы{% endblock %}
{% block content %}
<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Наименование нашей организации</label>
                <input type="text" name="organization_name" class="form-control" value="{{ const.organization_name }}">
            </div>
            <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Сохранить</button>
        </form>
    </div>
</div>
{% endblock %}
