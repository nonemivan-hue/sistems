{% extends "base.html" %}
{% block title %}Редактировать МФЦ{% endblock %}
{% block page_title %}Справочник: МФЦ - Редактирование{% endblock %}
{% block content %}
<div class="card mb-3">
    <div class="card-header bg-white">
        <strong><i class="bi bi-pencil"></i> Редактировать МФЦ</strong>
    </div>
    <div class="card-body">
        <form method="POST" action="{{ url_for('ref_mfcs_edit', item_id=item.id) }}" class="row g-3 align-items-end">
            <div class="col-md-3">
                <label class="form-label">Код</label>
                <input type="text" name="code" class="form-control" value="{{ item.code }}" required>
            </div>
            <div class="col-md-5">
                <label class="form-label">Наименование</label>
                <input type="text" name="name" class="form-control" value="{{ item.name }}" required>
            </div>
            <div class="col-md-4">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Сохранить</button>
                <a href="{{ url_for('ref_mfcs') }}" class="btn btn-outline-secondary"><i class="bi bi-x-lg"></i> Отмена</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
