{% extends "base.html" %}
{% block title %}Сводный отчет{% endblock %}
{% block page_title %}Сводный отчет по картам{% endblock %}
{% block content %}
<div class="card">
    <div class="card-body">
        <form method="POST" class="row g-3 align-items-end mb-4">
            <div class="col-md-3">
                <label class="form-label">Начало периода</label>
                <input type="date" name="start_date" class="form-control" value="{{ start_date }}" required>
            </div>
            <div class="col-md-3">
                <label class="form-label">Конец периода</label>
                <input type="date" name="end_date" class="form-control" value="{{ end_date }}" required>
            </div>
            <div class="col-md-3">
                <button type="submit" class="btn btn-primary"><i class="bi bi-search"></i> Сформировать</button>
            </div>
        </form>

        {% if report %}
        {% for row in report %}
        <h6 class="mt-3">{{ row.card_type_name }}</h6>
        <p><small>{{ row.numbers | join(', ') }}</small></p>
        {% endfor %}
        {% endif %}
    </div>
</div>
{% endblock %}
